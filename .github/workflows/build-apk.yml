name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Keystore tetap ada di repo (keystore/huawei-manager.jks), jadi tanda tangan
      # APK selalu sama di setiap build dan bisa di-update tanpa uninstall.
      - name: Build APK debug & release
        run: gradle assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: huawei-manager-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
